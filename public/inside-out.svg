<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep Navy to Electric Blue Swing Plane Gradient -->
    <linearGradient id="insideOutGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="50%" stop-color="#203A43" />
      <stop offset="100%" stop-color="#2C5364" />
    </linearGradient>
  </defs>

  <g transform="translate(0, 0)">
    <!-- Outer Abstract Orbit / Ellipse -->
    <path fill="url(#insideOutGradient)" d="M 235 90 
             C 340 90, 420 150, 420 240 
             C 420 310, 370 370, 280 395 
             C 295 380, 385 320, 385 240 
             C 385 170, 320 115, 235 115 
             C 175 115, 110 145, 80 195 
             C 105 130, 165 90, 235 90 Z" />

    <!-- Inner Swing Path / Ribbon Swoosh -->
    <path fill="url(#insideOutGradient)" d="M 180 410 
             C 140 400, 100 350, 100 270 
             C 100 180, 170 100, 240 70 
             C 215 95, 135 160, 135 260 
             C 135 320, 165 375, 210 395 
             C 200 402, 190 407, 180 410 Z" />

    <!-- Dynamic Crossing Accent (The Inside-to-Out Motion) -->
    <path fill="url(#insideOutGradient)" d="M 150 330 
             C 210 290, 310 200, 380 110 
             C 385 103, 395 90, 410 75 
             C 395 95, 370 125, 350 150 
             C 280 235, 190 315, 150 330 Z" />
  </g>
</svg>
